<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 — South American Football Culture</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; font-family: system-ui, sans-serif; }
figure { width: 100%; }
figure::before { content: ''; display: block; height: 4px; background: linear-gradient(90deg, #24324A, #B6842D); }
.img-wrap { width: 100%; height: 360px; overflow: hidden; background: #e8e4dc; position: relative; }
.img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fallback { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
.fallback-icon { font-size: 48px; opacity: 0.3; }
.fallback-text { font-size: 13px; color: #999; }
figcaption { background: #24324A; color: #c0b8a8; font-size: 13px; padding: 11px 18px; line-height: 1.55; }
figcaption b { color: #B6842D; font-weight: 700; }
</style>
</head>
<body>
<figure>
  <div class="img-wrap">
    <div class="fallback" id="fb">
      <div class="fallback-icon">⚽</div>
      <div class="fallback-text">Loading image…</div>
    </div>
    <img
      src="https://plus.unsplash.com/premium_photo-1663126982680-40c4ab8f42fd?q=80&w=1740&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
      alt="Football fans celebrating passionately in a packed South American stadium"
      onload="document.getElementById('fb').style.display='none'"
      onerror="document.getElementById('fb').innerHTML='<div class=fallback-icon>⚽</div><div class=fallback-text>Fan culture image — visible on live site</div>'"
      loading="lazy">
  </div>
  <figcaption>Buenos Aires and São Paulo rank inside the global top 10 — Argentina and Brazil hold the two highest Football Interest Ratings in South America. <b>Vegas Insider</b> · 2026 World Cup Workplace Disruption Study</figcaption>
</figure>
</body>
</html>
